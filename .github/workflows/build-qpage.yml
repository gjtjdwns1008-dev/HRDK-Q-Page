# .github/workflows/build-qpage.yml  (v2)
# ───────────────────────────────────────────────────────────────
# 하는 일: pdf/ 의 종목별 화면 PDF → PNG 변환 + 최신 외부공개 HTML을 묶어
#          dist/ 를 만들고 GitHub Pages로 배포한다.
#
# 실행 시점(v2에서 변경):
#   · q-page-outside_YYYY-MM-DD.html 이 올라올 때  ← 유일한 자동 방아쇠
#   · Actions 탭에서 수동 실행(Run workflow) 할 때
#   ※ pdf/ 업로드는 실행을 일으키지 않는다.
#     깃허브 웹은 한 번에 100개까지만 올라가므로 PDF를 여러 번에
#     나눠 올려도 조용하고, 다 올린 뒤 HTML을 올리면(또는 수동 실행)
#     그때 한 번만 돈다. → 연간 갱신은 "PDF 먼저, HTML 마지막" 순서.
#
# 파일 규약:
#   q-page-outside_YYYY-MM-DD.html 을 루트에 파일명 그대로 올리면
#   날짜상 가장 최신 파일이 index.html 로 배포된다. 과거 파일은
#   저장소에 남아 연도별 보관함이 되고, 웹에는 최신 1개만 노출.
#
# 안전장치:
#   q-page-inside* 또는 *내부용*.html 이 발견되면 배포 강제 중단.
#
# PNG는 커밋하지 않는다(빌드 산출물). 사전 1회 설정:
#   Settings → Pages → Source = "GitHub Actions". 비밀키 없음.
# ───────────────────────────────────────────────────────────────
name: Build & Deploy Q-Page 자격정보집

on:
  workflow_dispatch:
    inputs:
      dpi:
        description: '화면 PNG 해상도. 기본 200 — 폰에서 2배 확대까지 글자가 버팁니다'
        default: '200'
      pages:
        description: 'first=첫 쪽만 PNG(기본) · all=모든 쪽 PNG'
        default: 'first'
  push:
    branches: [ main ]
    paths:
      - 'q-page-outside_*.html'
      - 'tools/**'
      - '.github/workflows/build-qpage.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Pages 프로비저닝 확인/강제 (신규 레포 첫 배포 대비)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PDF 변환 도구 설치
        # poppler-utils: pdftoppm(래스터화) · pdfinfo(쪽수)
        # pngquant     : 감색. 없으면 용량이 3배가 된다(실측 247KB → 75KB)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils pngquant

      - name: 변환 결과 캐시 (바뀐 PDF만 다시 만들도록)
        uses: actions/cache@v4
        with:
          path: dist/sheets
          key: sheets-${{ inputs.dpi || '200' }}-${{ inputs.pages || 'first' }}-${{ hashFiles('pdf/**/*.pdf') }}
          restore-keys: sheets-${{ inputs.dpi || '200' }}-${{ inputs.pages || 'first' }}-

      - name: 화면 PDF → PNG 변환
        run: |
          if [ -d pdf ] && [ -n "$(ls -A pdf/*.pdf 2>/dev/null)" ]; then
            python tools/pdf_to_png.py pdf dist/sheets \
              --dpi "${{ inputs.dpi || '200' }}" \
              --pages "${{ inputs.pages || 'first' }}" | tee convert.log
            {
              echo '### 화면 PNG 변환'
              echo '```'
              sed -n '/\[변환 결과\]/,$p' convert.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pdf/ 에 PDF가 없습니다. 화면 원본 없이 배포합니다."
            echo '### 화면 PNG 변환 — 건너뜀 (pdf/ 비어 있음)' >> "$GITHUB_STEP_SUMMARY"
            mkdir -p dist/sheets
          fi

      - name: 사이트 파일 모으기 (최신 외부공개본 → index.html)
        run: |
          # ── 안전장치: 내부용 파일이 저장소에 올라오면 배포 강제 중단 ──
          FOUND_INSIDE=$( (ls q-page-inside* 2>/dev/null; ls *내부용*.html 2>/dev/null) | head -5 )
          if [ -n "$FOUND_INSIDE" ]; then
            echo "::error::내부용 파일이 저장소에서 발견되었습니다. 즉시 삭제 후 다시 push 하세요."
            echo "$FOUND_INSIDE"
            exit 1
          fi
          # ── 최신 외부공개본 선택(파일명의 날짜가 정렬 기준) ──
          LATEST=$(ls q-page-outside_*.html 2>/dev/null | sort | tail -1)
          if [ -z "$LATEST" ]; then
            echo "::error::q-page-outside_YYYY-MM-DD.html 파일이 저장소 루트에 없습니다."
            exit 1
          fi
          cp "$LATEST" dist/index.html
          [ -f robots.txt ] && cp robots.txt dist/ || true
          touch dist/.nojekyll
          {
            echo "### 배포 산출물"
            echo "- 홈(index)으로 배포된 파일: \`$LATEST\`"
            echo '```'
            du -sh dist dist/sheets 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 결과물(dist) 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
